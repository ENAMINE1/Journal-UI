<section class="editor-column"><div class="editor-toolbar"><span class="save-state">{{ dirty ? 'Unsaved changes' : 'Saved' }}</span><div><button class="delete-button" type="button" title="Delete note (D)" [disabled]="!note || isNew" (click)="delete.emit()">Delete <kbd>D</kbd></button><button class="save-button" type="button" title="Save note (Ctrl + S)" [disabled]="!dirty" (click)="save.emit()">Save note <kbd>Ctrl + S</kbd></button></div></div><article class="editor"><input class="title-editor" [value]="title" (input)="update('title', $event)" placeholder="Untitled note" aria-label="Note title"><div class="editor-meta"><span>{{ note ? 'Edited ' + formatDate(note.updatedAt) : 'New note' }}</span><label class="visibility">Visibility<select [value]="visibility" (change)="update('visibility', $event)"><option value="PRIVATE">Private</option><option value="PUBLIC">Shared</option></select></label></div><div class="format-toolbar" aria-label="Markdown formatting"><button type="button" title="Bold" (click)="applyMarkdown('bold', contentEditor)"><strong>B</strong></button><button type="button" title="Italic" (click)="applyMarkdown('italic', contentEditor)"><em>I</em></button><button type="button" title="Heading" (click)="applyMarkdown('heading', contentEditor)">H</button><button type="button" title="Bullet list" (click)="applyMarkdown('bullet', contentEditor)">&#8226;</button><button type="button" title="Quote" (click)="applyMarkdown('quote', contentEditor)">&#8220;</button><button type="button" title="Inline code" (click)="applyMarkdown('code', contentEditor)">&lt;/&gt;</button><button type="button" title="Code block" (click)="applyMarkdown('codeblock', contentEditor)">&#123;&#125;</button><button type="button" title="Task" (click)="applyMarkdown('check', contentEditor)">&#9744;</button><button type="button" title="Toggle" (click)="applyMarkdown('details', contentEditor)">&#9656;</button></div><div class="editor-body-grid"><div class="editor-input-wrap"><textarea #contentEditor class="content-editor" [value]="content" (input)="update('content', $event)" placeholder="Start writing... Type / for commands." aria-label="Note content"></textarea>@if (slashMenuOpen()) { <div class="slash-menu">@for (command of slashCommands; track command.format) { <button type="button" (click)="applySlashCommand(command.format, contentEditor)"><strong>/{{ command.name.toLowerCase().replace(' ', '-') }}</strong><span>{{ command.hint }}</span></button> }</div> }</div><article class="markdown-preview" [innerHTML]="renderedContent" aria-label="Rendered Markdown preview"></article></div></article><footer class="editor-footer"><span>Markdown notes</span>@if (error) { <span class="error-message">{{ error }}</span> }<span>Ctrl + S to save</span></footer></section>
