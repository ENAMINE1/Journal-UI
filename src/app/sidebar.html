<aside class="sidebar"><div class="brand-lockup"><span class="brand-mark">FN</span><span>Field Notes</span></div><button class="new-note" type="button" title="New note (Ctrl + N)" (click)="newNote.emit()"><span class="plus">+</span> New note</button><p class="section-label">Your desk</p><nav aria-label="Note filters">@for (filter of ['All notes', 'Private', 'Shared']; track filter) {<button class="nav-item" [class.active]="activeFilter === filter" type="button" (click)="filterChange.emit($any(filter))"><span class="nav-symbol">{{ filter === 'All notes' ? '□' : filter === 'Private' ? '◇' : '◆' }}</span><span>{{ filter }}</span>@if (filter === 'All notes') { <span class="count">{{ notes.length }}</span> }</button>}</nav><label class="theme-picker">Theme<select [value]="theme" (change)="themeChange.emit($event)"><option value="meadow">Meadow</option><option value="midnight">Midnight</option><option value="peach">Peach</option></select></label><div class="sidebar-bottom"><div class="account"><span class="avatar">{{ username.slice(0, 1).toUpperCase() }}</span><span><strong>{{ username }}</strong><small>Personal workspace</small></span></div><button class="sign-out" type="button" (click)="signOut.emit()">Sign out</button></div></aside>
