@if (!token()) {
  <app-auth-panel [mode]="authMode()" [loading]="loading()" [error]="authError()" (modeChange)="setAuthMode($event)" (submitForm)="submitAuth($event)"></app-auth-panel>
} @else {
  <main class="app-shell">
    <app-sidebar [username]="username()" [notes]="notes()" [activeFilter]="activeFilter()" [theme]="theme()" (newNote)="startNewNote()" (filterChange)="selectFilter($event)" (themeChange)="setTheme($event)" (signOut)="signOut()"></app-sidebar>
    <app-note-list [notes]="visibleNotes()" [selectedId]="selectedNoteId()" [activeFilter]="activeFilter()" [searchTerm]="searchTerm()" (searchChange)="updateSearch($event)" (noteSelected)="selectNote($event)" (refresh)="loadNotes()"></app-note-list>
    <app-note-editor [note]="selectedNote()" [title]="draftTitle()" [content]="draftContent()" [visibility]="draftVisibility()" [dirty]="isDirty()" [isNew]="isNewNote()" [error]="authError()" (draftChange)="updateDraft($event)" (save)="saveNote()" (delete)="deleteNote()"></app-note-editor>
  </main>
}
