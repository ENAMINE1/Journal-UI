<section class="notes-column"><header class="notes-header"><div><p class="eyebrow">Your desk</p><h1>{{ activeFilter }}</h1></div><button class="refresh" type="button" (click)="refresh.emit()" aria-label="Refresh notes">↻</button></header><label class="search-box"><span>⌕</span><input type="search" placeholder="Search your notes" [value]="searchTerm" (input)="searchChange.emit($event)" aria-label="Search your notes"></label><div class="notes-list">@for (note of notes; track note.id) {<article class="note-card" [class.active]="selectedId === note.id" (click)="noteSelected.emit(note.id)"><h2>{{ note.title }}</h2><p>{{ note.content }}</p><div class="note-meta"><span>{{ formatDate(note.updatedAt) }}</span><span>{{ note.accessType === 'PUBLIC' ? 'Shared' : 'Private' }}</span></div></article>} @empty {<div class="empty-list"><span>+</span><h2>No notes here yet.</h2><p>Start with a thought worth keeping.</p></div>}</div></section>
